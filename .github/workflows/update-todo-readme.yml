name: Sync README TODO list

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Check out dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Regenerate TODO section from dev source
        run: python3 .github/scripts/update_todo_readme.py

      - name: Commit README and remove temporary automation
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          rm -f .github/scripts/update_todo_readme.py .github/workflows/update-todo-readme.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No staged changes after cleanup."
            exit 0
          fi
          git commit -m "docs: sync README TODO list with dev code changes"
          git push origin HEAD:dev
