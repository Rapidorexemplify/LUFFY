name: Update TODO README

on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch main
        run: git fetch origin main:main

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update TODO list
        run: |
          python3 - <<'PY'
          import pathlib
          import re
          import subprocess

          repo = pathlib.Path.cwd()
          readme_path = repo / "README.md"
          readme = readme_path.read_text(encoding="utf-8")

          start_marker = "### 📝 Complete TODO List\n"
          start = readme.index(start_marker) + len(start_marker)
          end = readme.index("\n## ", start)
          section = readme[start:end]

          entry_re = re.compile(
              r"^- \[ \] \*\*(?P<path>[^:]+):(?P<line>\d+)\*\* - (?P<text>.*)$",
              re.MULTILINE,
          )
          entries = [m.group(0) for m in entry_re.finditer(section)]
          entry_map = {
              (m.group("path"), m.group("text")): int(m.group("line"))
              for m in entry_re.finditer(section)
          }

          def run_git(*args):
              return subprocess.check_output(["git", *args], text=True, cwd=repo)

          changed = [
              p
              for p in run_git("diff", "--name-only", "main...dev").splitlines()
              if p.endswith(".py")
          ]
          print("Changed Python files:", changed)

          def parse_todos(text):
              todos = []
              for i, line in enumerate(text.splitlines(), 1):
                  m = re.search(r"#\s*TODO\b(.*)", line)
                  if not m:
                      continue
                  rest = m.group(1)
                  if rest.startswith(":"):
                      rest = rest[1:]
                  todos.append((i, rest.strip()))
              return todos

          for path in changed:
              try:
                  main_text = run_git("show", f"main:{path}")
              except subprocess.CalledProcessError:
                  main_text = ""
              dev_text = run_git("show", f"dev:{path}")

              main_todos = parse_todos(main_text)
              dev_todos = parse_todos(dev_text)
              print(f"{path}: main={len(main_todos)} dev={len(dev_todos)}")

              for (p, text), line in list(entry_map.items()):
                  if p != path:
                      continue
                  matches = [ln for ln, todo_text in dev_todos if todo_text == text]
                  if matches:
                      entry_map[(p, text)] = matches[0]
                  else:
                      del entry_map[(p, text)]

              existing = set(entry_map.keys())
              main_texts = {text for _, text in main_todos}
              for line, text in dev_todos:
                  if (path, text) not in existing and text not in main_texts:
                      entry_map[(path, text)] = line
                      existing.add((path, text))

          def sort_key(entry):
              m = re.match(r"- \[ \] \*\*([^:]+):(\d+)\*\*", entry)
              return (m.group(1), int(m.group(2)))

          new_entries = sorted(
              [
                  f"- [ ] **{path}:{line}** - {text}"
                  for (path, text), line in entry_map.items()
              ],
              key=sort_key,
          )

          new_section = "\n" + "\n".join(new_entries) + "\n"
          new_readme = readme[:start] + new_section + readme[end:]
          readme_path.write_text(new_readme, encoding="utf-8")
          print(f"Updated {len(new_entries)} TODO entries")
          PY

      - name: Commit README
        run: |
          git add README.md
          if git diff --cached --quiet; then
            echo "No README changes"
          else
            git commit -m "docs: update TODO list after dev implementation"
            git push origin dev
          fi
