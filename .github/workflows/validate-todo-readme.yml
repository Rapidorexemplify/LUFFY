name: Validate TODO README

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate TODO list
        run: |
          python3 - <<'PY'
          import pathlib
          import re

          root = pathlib.Path.cwd()
          readme = (root / "README.md").read_text(encoding="utf-8")
          title = "### 📝 Complete TODO List"
          assert title in readme, "TODO title missing"
          start = readme.index(title) + len(title)
          end = readme.index("\n## ", start)
          section = readme[start:end]

          entry_re = re.compile(r"^- \[ \] \*\*(?P<path>[^:]+):(?P<line>\d+)\*\* - (?P<text>.*)$", re.MULTILINE)
          entries = [m.groupdict() for m in entry_re.finditer(section)]
          assert len(entries) == len(entry_re.findall(section)), "Malformed TODO entries"

          def parse_todos(path):
              todos = []
              for i, line in enumerate(path.read_text(encoding="utf-8", errors="ignore").splitlines(), 1):
                  m = re.search(r"#\s*TODO\b(.*)", line)
                  if not m:
                      continue
                  rest = m.group(1)
                  if rest.startswith(":"):
                      rest = rest[1:]
                  todos.append((i, rest.strip()))
              return todos

          code_todos = {}
          for path in root.rglob("*.py"):
              if ".git" in path.parts or "__pycache__" in path.parts:
                  continue
              rel = path.relative_to(root).as_posix()
              code_todos[rel] = parse_todos(path)

          by_file = {}
          for e in entries:
              by_file.setdefault(e["path"], []).append((int(e["line"]), e["text"]))

          total_code = sum(len(v) for v in code_todos.values())
          total_readme = len(entries)
          print(f"Code TODOs: {total_code}")
          print(f"README TODOs: {total_readme}")

          mismatches = []
          for path in sorted(set(code_todos) | set(by_file)):
              code = code_todos.get(path, [])
              readme_items = by_file.get(path, [])
              if code != readme_items:
                  mismatches.append(path)
                  print(f"MISMATCH {path}: code={len(code)} readme={len(readme_items)}")
                  code_set = set(code)
                  readme_set = set(readme_items)
                  for item in sorted(code_set - readme_set):
                      print(f"  missing in README: {item}")
                  for item in sorted(readme_set - code_set):
                      print(f"  extra in README:   {item}")
                  # Compare line numbers for matching texts
                  code_by_text = {}
                  for line, text in code:
                      code_by_text.setdefault(text, []).append(line)
                  readme_by_text = {}
                  for line, text in readme_items:
                      readme_by_text.setdefault(text, []).append(line)
                  for text in sorted(set(code_by_text) & set(readme_by_text)):
                      if code_by_text[text] != readme_by_text[text]:
                          print(f"  line mismatch: {text}: code={code_by_text[text]} readme={readme_by_text[text]}")

          assert not mismatches, f"TODO mismatches in {mismatches}"

          keys = [(e["path"], int(e["line"])) for e in entries]
          assert keys == sorted(keys), "TODO entries are not sorted"
          print("Validation passed")
          PY
